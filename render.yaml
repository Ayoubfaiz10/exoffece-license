services:
  - type: web
    name: lexoffece-license
    runtime: node
    plan: free
    rootDir: license-server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAX_MACHINES
        value: "1"
      - key: LICENSE_DEFAULT_DAYS
        value: "365"
